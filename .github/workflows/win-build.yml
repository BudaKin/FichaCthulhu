name: Build Windows Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller Pillow
        # pip install -r requirements.txt

    - name: Build EXE with PyInstaller (onefile)
      run: |
        pyinstaller --onefile --windowed --name cthulhu --icon=assets/cthulhu.ico --add-data "assets;assets" main.py

    - name: Prepare release folder
      run: |
        mkdir LixoEnterprise
        move "dist\cthulhu.exe" "LixoEnterprise\cthulhu.exe"
        if (Test-Path "assets") {
            xcopy "assets" "LixoEnterprise\assets" /E /I /Y
        }
      shell: powershell

    - name: Create ZIP
      run: |
        Compress-Archive -Path "LixoEnterprise\*" -DestinationPath "LixoEnterprise.zip"
      shell: powershell

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: app-exe
        path: LixoEnterprise\cthulhu.exe

    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:
        name: app-zip
        path: LixoEnterprise.zip
