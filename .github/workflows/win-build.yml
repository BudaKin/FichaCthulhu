name: Build Windows Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller Pillow ttkbootstrap

    - name: Build EXE with PyInstaller
      shell: powershell
      run: |
        pyinstaller `
          --onefile `
          --windowed `
          --name cthulhu `
          --icon=assets/cthulhu.ico `
          --add-data "assets;assets" `
          main.py

    - name: Prepare installer folder
      shell: powershell
      run: |
        mkdir LixoEnterprise
        Copy-Item dist\cthulhu.exe LixoEnterprise\cthulhu.exe
        Copy-Item assets LixoEnterprise\assets -Recurse

    - name: Install NSIS
      uses: crazy-max/ghaction-nsis@v3
      with:
        version: "3.09"

    - name: Build installer
      run: makensis installer.nsi

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Installer
        path: LixoEnterpriseInstaller.exe