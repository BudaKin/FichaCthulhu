name: Build Windows Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller Pillow ttkbootstrap

    - name: Build EXE with PyInstaller
      shell: powershell
      run: |
        pyinstaller `
          --onefile `
          --windowed `
          --name cthulhu `
          --icon=assets/cthulhu.ico `
          --add-data "assets;assets" `
          --hidden-import PIL.Image `
          --hidden-import PIL.ImageTk `
          --hidden-import PIL._imagingtk `
          main.py

    - name: Prepare release folder
      shell: powershell
      run: |
        mkdir LixoEnterprise
        Copy-Item dist\cthulhu.exe LixoEnterprise\cthulhu.exe

        # Copia assets apenas se quiser distribuir junto
        if (Test-Path assets) {
          Copy-Item assets LixoEnterprise\assets -Recurse
        }

    - name: Create ZIP
      shell: powershell
      run: |
        Compress-Archive -Path "LixoEnterprise\*" -DestinationPath "LixoEnterprise.zip"

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: app-exe
        path: LixoEnterprise\cthulhu.exe

    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:
        name: app-zip
        path: LixoEnterprise.zip