name: Build Windows Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller Pillow
        # pip install -r requirements.txt

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --windowed --name cthulhu --icon=assets/cthulhu.ico --add-data "assets/cthulhu.ico;assets" main.py

    - name: Prepare release folder
      run: |
        mkdir LixoEnterprise
        xcopy dist\cthulhu.exe LixoEnterprise\ /E /I /Y
        xcopy dist\* LixoEnterprise\ /E /I /Y

    - name: Create ZIP
      run: |
        powershell Compress-Archive -Path LixoEnterprise\* -DestinationPath LixoEnterprise.zip

    - name: Install NSIS
      run: choco install nsis -y

    - name: Build NSIS installer
      run: |
        & "$env:ProgramFiles(x86)\NSIS\makensis.exe" installer.nsi

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: app-exe
        path: dist/cthulhu.exe

    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:
        name: app-zip
        path: LixoEnterprise.zip

    - name: Upload Installer (NSIS)
      uses: actions/upload-artifact@v4
      with:
        name: installer
        path: installer.exe
