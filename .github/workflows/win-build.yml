name: Build Windows Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller Pillow
        # pip install -r requirements.txt

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --windowed --name cthulhu --icon=assets/cthulhu.ico --add-data "assets;assets" main.py

    - name: Prepare release folder
      run: |
        mkdir LixoEnterprise
        xcopy "dist\cthulhu\cthulhu.exe" "LixoEnterprise\" /I /Y
        if (Test-Path "dist\cthulhu\assets") {
            xcopy "dist\cthulhu\assets" "LixoEnterprise\assets" /E /I /Y
        }
      shell: powershell

    - name: Create ZIP
      run: |
        Compress-Archive -Path "LixoEnterprise\*" -DestinationPath "LixoEnterprise.zip"
      shell: powershell

    - name: Install NSIS
      run: choco install nsis -y
      shell: powershell

    - name: Build NSIS installer
      run: |
        & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
      shell: powershell

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: app-exe
        path: dist\cthulhu\cthulhu.exe

    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:
        name: app-zip
        path: LixoEnterprise.zip

    - name: Upload Installer (NSIS)
      uses: actions/upload-artifact@v4
      with:
        name: installer
        path: installer.exe
